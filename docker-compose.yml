services:
  search-server:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
      - DATA_PATH=/data
    volumes:
      - ./data_10000:/data:ro
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: